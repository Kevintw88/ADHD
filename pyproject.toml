[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-idsec"
version = "0.1.0"
description = "AD + Entra ID 混合環境 AI 資安防護平台（MVP：Phase 0+1，唯讀）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "networkx>=3.2",
  "mcp>=1.2",
  "claude-agent-sdk>=0.1",
]

[project.optional-dependencies]
live = [
  "ldap3>=2.9",
  "httpx>=0.27",
  "msal>=1.28",
  "neo4j>=5.20",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
idsec = "idsec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
