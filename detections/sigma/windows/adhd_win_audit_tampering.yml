title: Directory Services Restore Mode Password Changed
id: 8ed4f93e-364e-571c-81fa-c0d671bd8d36
status: experimental
description: The DSRM administrator password was set on a domain controller. With DsrmAdminLogonBehavior changed, it becomes a persistent local administrator on the DC.
author: ADHD
date: 2026-10-21
tags:
    - attack.persistence
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4794
    condition: selection
level: high
adhd:
    title_zh: DSRM 密碼被變更
    response_zh: 確認是否為計畫中的變更；檢查 DC 的 DsrmAdminLogonBehavior 登錄值。
