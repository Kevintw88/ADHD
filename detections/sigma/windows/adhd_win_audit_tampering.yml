title: Audit Policy Changed
id: 89c785a7-e0c5-524c-a5a2-de055f665685
status: experimental
description: The system audit policy was changed on a domain controller (attackers disable auditing before acting).
author: ADHD
date: 2026-10-21
tags:
    - attack.defense-evasion
    - attack.t1562.002
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4719
    condition: selection
falsepositives:
    - Group Policy refresh applying planned audit settings
level: medium
adhd:
    title_zh: 稽核原則被變更
    response_zh: 確認是否為 GPO 套用；若為手動變更，調查執行者並恢復稽核設定。
