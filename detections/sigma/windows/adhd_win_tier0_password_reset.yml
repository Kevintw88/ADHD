title: Password Of A Tier0 Account Reset By A Non-Tier0 Account
id: adc00d88-ce77-562b-b5fb-0d733f6300f5
status: experimental
description: |
    A Tier0 account's password was reset (4724) by an account that is not itself Tier0. Delegated
    password-reset rights reaching Tier0 accounts are a common attack path (see PATH-001 / AD-020).
    Environment-specific: %tier0_accounts% comes from the ADHD analysis.
author: ADHD
date: 2026-10-21
tags:
    - attack.persistence
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4724
        TargetSid|expand: '%tier0_accounts%'
    filter_tier0_actor:
        SubjectUserSid|expand: '%tier0_accounts%'
    condition: selection and not filter_tier0_actor
level: high
adhd:
    title_zh: 非 Tier0 帳號重設 Tier0 帳號的密碼
    response_zh: 確認執行者與變更單；若非預期，立即再重設該帳號密碼、撤銷工作階段並調查執行者。
    requires_env: [tier0_accounts]
