title: Member Added To A Tier0 Group
id: 34789217-4a77-59ce-b3ce-71a4889afce4
status: experimental
description: |
    A member was added to a privileged group: the well-known Tier0 groups (Domain Admins, Enterprise Admins,
    Schema Admins, Key Admins, Administrators, Account / Server / Print / Backup Operators) and the
    environment's other Tier0 groups (%tier0_groups%).
author: ADHD
date: 2026-10-21
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection_event:
        EventID:
            - 4728
            - 4732
            - 4756
    selection_wellknown:
        - TargetSid|endswith:
              - '-512'
              - '-518'
              - '-519'
              - '-526'
              - '-527'
        - TargetSid:
              - 'S-1-5-32-544'
              - 'S-1-5-32-548'
              - 'S-1-5-32-549'
              - 'S-1-5-32-550'
              - 'S-1-5-32-551'
    selection_env:
        TargetSid|expand: '%tier0_groups%'
    condition: selection_event and (selection_wellknown or selection_env)
falsepositives:
    - Planned administrator changes (match against change tickets)
level: high
adhd:
    title_zh: Tier0 群組新增成員
    response_zh: 對照變更單；無核准紀錄則立即移除成員、調查執行者（SubjectUserName）並檢查新成員的其他權限。
