title: Authentication Failure (Bad Password)
id: bc261a05-b9e7-5ce1-af93-7f1e58aafc8c
name: adhd_auth_failure
status: experimental
description: Kerberos pre-authentication failed or NTLM logon failed because of a wrong password. Used by the spray and brute-force correlations.
author: ADHD
date: 2026-10-21
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    product: windows
    service: security
detection:
    selection_kerberos:
        EventID: 4771
        Status: '0x18'
    selection_ntlm:
        EventID: 4625
        SubStatus: '0xc000006a'
    filter_machine:
        TargetUserName|endswith: '$'
    condition: 1 of selection_* and not filter_machine
level: low
adhd:
    title_zh: 驗證失敗（密碼錯誤）
---
title: Password Spray - One Source, Many Accounts
id: 4a269c2a-7c2e-5491-9131-610a38983066
status: experimental
description: Wrong-password failures for ten or more different accounts from one source address within ten minutes.
author: ADHD
date: 2026-10-21
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - adhd_auth_failure
    group-by:
        - IpAddress
    timespan: 10m
    condition:
        gte: 10
        field: TargetUserName
level: high
adhd:
    title_zh: 密碼噴灑：同一來源對大量帳號嘗試密碼
    response_zh: 封鎖或調查來源 IP；檢查同一時段是否有成功登入（4624 / 4768）的帳號並強制重設密碼。
---
title: Brute Force - Many Failures For One Account
id: 9d1d4619-5341-5739-bece-e6732eb4cb01
status: experimental
description: Twenty or more wrong-password failures for one account within ten minutes.
author: ADHD
date: 2026-10-21
tags:
    - attack.credential-access
    - attack.t1110.001
correlation:
    type: event_count
    rules:
        - adhd_auth_failure
    group-by:
        - TargetUserName
    timespan: 10m
    condition:
        gte: 20
level: medium
adhd:
    title_zh: 暴力破解：單一帳號短時間大量密碼錯誤
    response_zh: 確認是否為使用者記錯密碼的服務 / 裝置；否則調查來源並考慮暫時封鎖。
